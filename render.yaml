# Render Web Service — syntora.space форма + @MegaPromptBot webhook
# Dashboard → New → Blueprint → подключить репозиторий с этим файлом

services:
  - type: web
    name: syntora-lead-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        value: "815564766"
      - key: ALLOWED_ORIGINS
        value: https://syntora.space
      - key: DB_PATH
        value: /tmp/leads.db
      - key: BOT_DB_PATH
        value: /tmp/bot_leads.db
      - key: WEBHOOK_BASE_URL
        sync: false
