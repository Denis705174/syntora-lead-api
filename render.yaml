# Render Web Service — syntora.space форма + оба демо-бота
# Dashboard → New → Blueprint → подключить репозиторий с этим файлом

services:
  - type: web
    name: syntora-lead-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        value: "815564766"
      - key: ALLOWED_ORIGINS
        value: https://syntora.space
      - key: DB_PATH
        value: /tmp/leads.db
      - key: BOT_DB_PATH
        value: /tmp/bot_leads.db
      - key: WEBHOOK_BASE_URL
        value: https://syntora-lead-api.onrender.com
      - key: KITCHEN_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OPENAI_MODEL
        value: gemini-2.0-flash
      - key: SPREADSHEET_ID
        sync: false
      - key: GOOGLE_CREDS_JSON
        sync: false
